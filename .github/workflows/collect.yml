name: Collect research candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m newsintel collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-candidates
          path: private/runs/
          retention-days: 7
