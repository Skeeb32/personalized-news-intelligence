<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">Personalized News Intelligence</title>
<desc id="desc">From information overload to an informed point of view. A Python research pipeline for technology, careers, and thoughtful publishing.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e32"/><stop offset="1" stop-color="#071018"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#52e1bf"/><stop offset="1" stop-color="#8ccfff"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#24374b" stroke-width=".7"/></pattern>
</defs>
<rect width="1280" height="520" rx="24" fill="url(#bg)"/>
<rect width="1280" height="520" rx="24" fill="url(#grid)" opacity=".4"/>
