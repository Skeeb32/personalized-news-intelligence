<text x="48" y="163" fill="#f1f6fc" font-family="Arial, sans-serif" font-size="62" font-weight="700">Find the signal.</text>
<text x="48" y="235" fill="#52e1bf" font-family="Arial, sans-serif" font-size="62" font-weight="700">Build your perspective.</text>
<text x="50" y="285" fill="#b8c9da" font-family="Arial, sans-serif" font-size="21">Technology research. Career discovery. Thoughtful publishing.</text>
<text x="50" y="320" fill="#839bb2" font-family="Arial, sans-serif" font-size="18">A Python pipeline that keeps evidence and editorial judgment in view.</text>
<rect x="50" y="364" width="186" height="38" rx="19" fill="#17392f" stroke="#326756"/>
<text x="143" y="389" fill="#94f1cf" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">PYTHON · STANDARD LIBRARY</text>
<rect x="250" y="364" width="170" height="38" rx="19" fill="#142c41" stroke="#2e4a63"/>
<text x="335" y="389" fill="#a5d8ff" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">HUMAN REVIEW BUILT IN</text>
<g transform="translate(920 120)">
  <rect x="20" y="0" width="230" height="272" rx="16" fill="#152536" stroke="#32485e"/>
  <rect x="0" y="24" width="230" height="272" rx="16" fill="#0e1c2b" stroke="#49637b"/>
  <rect x="20" y="46" width="48" height="5" rx="2" fill="url(#accent)"/>
  <text x="20" y="83" fill="#f1f6fc" font-family="Arial, sans-serif" font-size="20" font-weight="700">THE DAILY BRIEF</text>
  <text x="20" y="108" fill="#93a9bd" font-family="Arial, sans-serif" font-size="12">RESEARCH → REVIEW → PERSPECTIVE</text>
  <path d="M20 130H210" stroke="#2f455a"/>
  <text x="20" y="166" fill="#52e1bf" font-family="Arial, sans-serif" font-size="28" font-weight="700">05</text>
  <text x="72" y="162" fill="#c0cfdd" font-family="Arial, sans-serif" font-size="14">ranked developments</text>
  <text x="20" y="211" fill="#85c7ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">10</text>
  <text x="72" y="207" fill="#c0cfdd" font-family="Arial, sans-serif" font-size="14">job target, no filler</text>
  <text x="20" y="256" fill="#f1f6fc" font-family="Arial, sans-serif" font-size="28" font-weight="700">01</text>
  <text x="72" y="252" fill="#c0cfdd" font-family="Arial, sans-serif" font-size="14">informed point of view</text>
